<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Finance 247 | Brand icon board</title>
    <style>
      :root { --purple: #6905f2; --purple-10: #f0e6fe; --blackcurrant: #160132; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; color: var(--blackcurrant); background: #fff; }
      .board { width: 820px; max-width: 100%; margin: 0 auto; }
      .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 1.15rem; }
      .bar { display: flex; gap: 6px; }
      .bar button { border: 2px solid var(--purple); background: #fff; color: var(--purple); border-radius: 999px; padding: 3px 12px; font: inherit; font-size: 13px; cursor: pointer; }
      .bar button[aria-pressed='true'] { background: var(--purple); color: #fff; }
      .panel { background: var(--bg, #fff); border-radius: 16px; padding: 14px 16px 10px; box-shadow: inset 0 0 0 1px rgb(105 5 242 / 0.15); color: var(--fg, var(--blackcurrant)); }
      .row { display: grid; grid-template-columns: 88px repeat(8, 1fr); align-items: center; gap: 4px; padding: 4px 0; }
      .row + .row { border-top: 1px solid rgb(105 5 242 / 0.12); }
      .name { font-size: 12px; font-weight: 600; line-height: 1.25; }
      .row img { width: 100%; max-width: 76px; aspect-ratio: 1; display: block; margin: 0 auto; }
      .labels { display: grid; grid-template-columns: 88px repeat(8, 1fr); gap: 4px; font-size: 10px; text-align: center; opacity: 0.75; margin-bottom: 2px; }
      @media (max-width: 640px) { .row, .labels { grid-template-columns: 56px repeat(8, 1fr); } .name { font-size: 10px; } .labels { font-size: 7px; } }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="top">
        <h1>Car Finance 247 brand icons: three directions</h1>
        <div class="bar" id="bar"></div>
      </div>
      <div class="panel" id="panel">
        <div class="labels" id="labels"></div>
        <div id="rows"></div>
      </div>
    </div>
    <script>
      var icons = [['calculator', 'Calculator'], ['car', 'Car'], ['key', 'Key'], ['piggy-bank', 'Budget'], ['shield-tick', 'Credit check'], ['phone-tick', 'Quote'], ['application', 'Application'], ['thumbs-up', 'Approved']]
      var styles = [['', 'A. Chunky'], ['glass/', 'B. Glossy'], ['3d/', 'C. 3D']]
      var bgs = [['#ffffff', 'White', ''], ['#f0e6fe', 'Lilac', ''], ['#6905f2', 'Purple', '#ffffff']]
      var labels = document.getElementById('labels')
      labels.appendChild(document.createElement('span'))
      icons.forEach(function (i) { var s = document.createElement('span'); s.textContent = i[1]; labels.appendChild(s) })
      var rows = document.getElementById('rows')
      styles.forEach(function (st) {
        var r = document.createElement('div'); r.className = 'row'
        var n = document.createElement('div'); n.className = 'name'; n.textContent = st[1]; r.appendChild(n)
        icons.forEach(function (i) { var im = document.createElement('img'); im.src = st[0] + i[0] + '.svg'; im.alt = i[1]; r.appendChild(im) })
        rows.appendChild(r)
      })
      var bar = document.getElementById('bar'), panel = document.getElementById('panel')
      function setBg(b, btn) {
        panel.style.setProperty('--bg', b[0]); panel.style.setProperty('--fg', b[2] || '#160132')
        bar.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === btn) })
      }
      bgs.forEach(function (b, k) {
        var btn = document.createElement('button'); btn.textContent = b[1]; btn.onclick = function () { setBg(b, btn) }
        bar.appendChild(btn); if (k === 0) setBg(b, btn)
      })
    </script>
  </body>
</html>
