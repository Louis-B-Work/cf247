<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Finance 247 | Brand icon styles compared</title>
    <style>
      :root { --purple: #6905f2; --purple-10: #f0e6fe; --blackcurrant: #160132; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px 16px 48px; font-family: system-ui, sans-serif; color: var(--blackcurrant); background: #fff; }
      h1 { margin: 0 0 12px; font-size: 1.4rem; }
      .bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
      .bar button { border: 2px solid var(--purple); background: #fff; color: var(--purple); border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
      .bar button[aria-pressed='true'] { background: var(--purple); color: #fff; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 760px; }
      .head { font-weight: 600; font-size: 13px; text-align: center; }
      .cell { border-radius: 14px; padding: 8px; text-align: center; background: var(--bg, #fff); box-shadow: inset 0 0 0 1px rgb(105 5 242 / 0.15); }
      .cell img.big { width: 100%; max-width: 128px; aspect-ratio: 1; }
      .cell img.small { width: 48px; height: 48px; display: block; margin: 2px auto 0; }
      .label { grid-column: 1 / -1; font-size: 13px; margin: 10px 0 -2px; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Icon styles compared</h1>
    <div class="bar" id="bar"></div>
    <div class="grid" id="grid"></div>
    <script>
      var icons = [['calculator', 'Finance calculator'], ['car', 'Car'], ['key', 'Key'], ['piggy-bank', 'Budget'], ['shield-tick', 'Soft credit check'], ['phone-tick', 'Quote in minutes'], ['application', 'Application'], ['thumbs-up', 'Approved']]
      var styles = [['', 'Chunky (first)'], ['glass/', 'Glossy 3D (Wise-style)'], ['3d/', '3D']]
      var bgs = [['#ffffff', 'White'], ['#f0e6fe', 'Lilac'], ['#6905f2', 'Purple']]
      var grid = document.getElementById('grid')
      styles.forEach(function (s) { var h = document.createElement('div'); h.className = 'head'; h.textContent = s[1]; grid.appendChild(h) })
      icons.forEach(function (i) {
        var l = document.createElement('div'); l.className = 'label'; l.textContent = i[1]; grid.appendChild(l)
        styles.forEach(function (s) {
          var c = document.createElement('div'); c.className = 'cell'
          c.innerHTML = '<img class="big" src="' + s[0] + i[0] + '.svg" alt="" /><img class="small" src="' + s[0] + i[0] + '.svg" alt="" />'
          grid.appendChild(c)
        })
      })
      var bar = document.getElementById('bar')
      function setBg(b, btn) {
        document.querySelectorAll('.cell').forEach(function (c) { c.style.setProperty('--bg', b[0]) })
        bar.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === btn) })
      }
      bgs.forEach(function (b, n) {
        var btn = document.createElement('button'); btn.textContent = b[1]
        btn.onclick = function () { setBg(b, btn) }
        bar.appendChild(btn)
        if (n === 0) setBg(b, btn)
      })
    </script>
  </body>
</html>
