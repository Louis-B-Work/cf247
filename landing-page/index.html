<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6905F2" />
    <title>Refinance your car | Car Finance 247 landing page mockup</title>
    <script>
      // Apply the saved heading font before first paint so text (and the hero car below it) doesn't reflow.
      try {
        var saved = localStorage.getItem('cf247-heading-font')
        document.documentElement.dataset.headingFont = ['general-sans', 'satoshi'].indexOf(saved) > -1 ? saved : 'general-sans'
        var green = localStorage.getItem('cf247-green')
        document.documentElement.dataset.green = ['fresh', 'green'].indexOf(green) > -1 ? green : 'original'
        var btn = localStorage.getItem('cf247-btn')
        document.documentElement.dataset.btn = ['static', 'plain'].indexOf(btn) > -1 ? btn : 'slide'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300..800;1,500..800&display=swap"
    />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <!-- One link per family: Fontshare ignores all but the first f[] in a combined request. Variable files cover every weight. -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@1,2&display=swap" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2&display=swap" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://cdn.imagin.studio" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
