<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6905F2" />
    <title>Refinance your car | Car Finance 247 landing page mockup</title>
    <script>
      // Apply the saved heading font before first paint so text (and the hero car below it) doesn't reflow.
      try {
        // One-off preset: every visitor starts on Neulis Neue with green CTAs, even if an earlier visit saved other choices.
        if (localStorage.getItem('cf247-preset') !== 'neulis-green') {
          localStorage.setItem('cf247-heading-font', 'neulis-neue')
          localStorage.setItem('cf247-cta-color', 'green')
          localStorage.setItem('cf247-preset', 'neulis-green')
        }
        var saved = localStorage.getItem('cf247-heading-font')
        document.documentElement.dataset.headingFont = ['neulis-neue', 'neulis-sans'].indexOf(saved) > -1 ? saved : 'neulis-neue'
        document.documentElement.dataset.ctaColor = localStorage.getItem('cf247-cta-color') === 'default' ? 'default' : 'green'
        var green = localStorage.getItem('cf247-green')
        document.documentElement.dataset.green = ['fresh', 'green'].indexOf(green) > -1 ? green : 'original'
        var btn = localStorage.getItem('cf247-btn')
        document.documentElement.dataset.btn = ['static', 'plain'].indexOf(btn) > -1 ? btn : 'slide'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300..800;1,500..800&display=swap"
    />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://cdn.imagin.studio" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
