name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # The Aeonik variant (with the CoType trial fonts) is built locally and kept on its own branch, so main never holds the
      # fonts. It is published at an unlisted path, for internal review only. The licence bars the trial fonts on public
      # websites, so remove these two steps to take it down.
      - name: Check out the Aeonik build
        uses: actions/checkout@v4
        with:
          ref: aeonik-site
          path: aeonik-build

      - name: Add the Aeonik build under its unlisted path
        run: |
          mkdir -p dist/review-8bf85032d4af8b4663
          cp -r aeonik-build/. dist/review-8bf85032d4af8b4663/
          rm -rf dist/review-8bf85032d4af8b4663/.git dist/review-8bf85032d4af8b4663/README.md

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
