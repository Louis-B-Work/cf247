name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # The Aeonik variant (with the CoType trial fonts) is built locally and kept on its own branch, so main never holds the
      # fonts. It is published at /cf247/aeonik/. Remove these two steps to take it down.
      - name: Check out the Aeonik build
        uses: actions/checkout@v4
        with:
          ref: aeonik-site
          path: aeonik-build

      - name: Add the Aeonik build under /aeonik
        run: |
          mkdir -p dist/aeonik
          cp -r aeonik-build/. dist/aeonik/
          rm -rf dist/aeonik/.git dist/aeonik/README.md

      # The design system, as a static page built from the claude.ai design system artifact. It includes the Aeonik trial
      # fonts, so like the Aeonik build above it lives on its own branch. Published at /cf247/new-design-system/.
      # Remove these two steps to take it down.
      - name: Check out the design system site
        uses: actions/checkout@v4
        with:
          ref: design-system-site
          path: design-system-build

      - name: Add the design system under /new-design-system
        run: |
          mkdir -p dist/new-design-system
          cp -r design-system-build/. dist/new-design-system/
          rm -rf dist/new-design-system/.git dist/new-design-system/README.md

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
